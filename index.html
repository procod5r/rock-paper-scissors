<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Hi, Let's Play!</h1>
        <h2>The game consists of 5 rounds.</h2>

        <h3 class="round"></h3>


        <div class="results-container">
            <div class="scores">
                <span class="userScoreSpan"></span>
                <span class="compScoreSpan"></span>
            </div>

            <p id="choose-text">Choose to play the game: </p>
            <div class="btn-container">

            </div>
            <p class="choice-info"></p>
            <p class="round-info"></p>
        </div>
    </div>
</body>

<script src="script.js"></script>
</html>
