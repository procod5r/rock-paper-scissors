<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock-paper-scissors</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: cadetblue;
        }

        .scores {
            background-color: beige;
            display: flex;
            justify-content: space-between;
        }

        .game-container {
            background-color: rgb(128, 225, 228);
            margin: 32px;
            padding: 16px 48px;
            border-radius: 16px;
            text-align: center;
            width: max-content;
            box-shadow: 15px 15px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid rgb(97, 97, 255);
        }

        .game-container h1, .game-container h2 {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            color: #2a2a2a;
        }

        .options {
            padding: 8px 16px;
            border-radius: 10px;
            background-color: cadetblue;
            color: white;
            font-weight: 600;
        }

        .options:hover {
            opacity: 0.7;
        }

        .results-container {
            padding: 20px;
            background-color: rgb(183, 253, 255);
            border-radius: 3px;
        }
        #choose-text {
            font-size: 20px;
            color: #1a1a1a;
        }

        .btn-container {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            /* flex-direction: column; */
        }
        .btn-container * {
            flex: 1 1 0;
        }
        .round-info {
            color: #454545;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Hi, Let's play!</h1>
        <h2>The game consists of 5 rounds.</h2>

        <h3 class="round"></h3>


        <div class="results-container">
            <div class="scores">
                <span class="userScoreSpan"></span>
                <span class="compScoreSpan"></span>
            </div>

            <p id="choose-text">Choose to play the game: </p>
            <div class="btn-container">

            </div>
            <p class="round-info"></p>
        </div>
    </div>
</body>

<script src="script.js"></script>
</html>
